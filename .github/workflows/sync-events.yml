name: Sync Content (Events + Quote)

# Runs on a schedule. Checks rolodex.lol for events not yet in shows.json
# and Airtable for a new set of quotes, updates whichever files changed,
# and — only if something actually changed — commits and pushes to main.
# That push is what triggers Vercel to rebuild and redeploy, the same as
# if you'd edited the files by hand and pushed them yourself.
#
# You can also trigger it manually from the "Actions" tab on GitHub
# (workflow_dispatch below) to test it without waiting for the schedule.

on:
    schedule:
        # Every hour, on the hour. GitHub schedules are UTC and can be delayed
        # by a few minutes during high load — that's normal, not a bug.
        - cron: '0 * * * *'
    workflow_dispatch: {}

# Needed so the job can push a commit back to the repo using the
# auto-generated GITHUB_TOKEN, instead of a personal access token.
permissions:
    contents: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Sync events from rolodex.lol
              run: node scripts/syncEvents.mjs

            - name: Sync quotes from Airtable
              env:
                  AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
                  AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
                  AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
              run: node scripts/syncQuote.mjs

            - name: Commit and push if anything changed
              run: |
                  if git diff --quiet -- src/data/shows.json src/data/quotes.json; then
                    echo "Nothing new — nothing to commit."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add src/data/shows.json src/data/quotes.json
                  git commit -m "Sync events and quote from rolodex.lol / Airtable"
                  git push
